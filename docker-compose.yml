services:
  postgres:
    image: postgres:16-alpine
    container_name: live_stream_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: live_stream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: live_stream_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: auth_service
    environment:
      - SECRET_KEY=django-insecure-prod-live-stream-key
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=live_stream_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  stream_service:
    build:
      context: .
      dockerfile: services/stream_service/Dockerfile
    container_name: stream_service
    environment:
      - SECRET_KEY=django-insecure-prod-live-stream-key
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=live_stream_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8001:8001"
    volumes:
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth_service:
        condition: service_started

  gateway:
    image: nginx:alpine
    container_name: live_stream_gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - stream_service

volumes:
  postgres_data:
