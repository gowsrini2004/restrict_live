events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate limiting zones for high traffic (1000+ users)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    upstream auth_backend {
        server auth_service:8000;
        keepalive 32;
    }

    upstream stream_backend {
        server stream_service:8001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Auth & User endpoints
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=50 nodelay;
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/admin/ {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Stream & Questions endpoints
        location /api/v1/stream/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://stream_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/questions/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://stream_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Healthcheck endpoint
        location /health {
            return 200 '{"status": "healthy", "capacity": "1000_concurrent"}';
        }
    }
}
