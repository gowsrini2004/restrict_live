<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Prevent pinch-zoom on mobile to keep the video player layout fixed -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- SEO -->
    <title>Sri Ramakrishna Math — Live Event Streaming</title>
    <meta name="description" content="Secure live event streaming platform for Sri Ramakrishna Math International Retreat. Watch live sessions, participate in Q&A, and engage with the event." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Sri Ramakrishna Math — Live Event Streaming" />
    <meta property="og:description" content="Secure live event streaming for Sri Ramakrishna Math." />
    <meta property="og:type" content="website" />

    <!-- Prevent right-click save-as, drag and drop of images for security -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Google Fonts: Inter for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
